<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bất động sản Thanh Hải</title>
<style>
:root{--bg:#f4f8fd;--card:#fff;--tx:#10264a;--mut:#5d6f8c;--bd:#d5e0f0;--bl:#0b4fa8;--bl2:#e4eefc;--yl:#f5b800;--yl2:#fff4cc;--ok:#1f8a4c;--ok2:#e0f4e8;--gr:#6b7280;--gr2:#eceef2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1630;--card:#13244a;--tx:#eaf1ff;--mut:#9fb2d6;--bd:#27407a;--bl:#6aa5ff;--bl2:#1b3566;--yl:#ffc928;--yl2:#4a3a05;--ok:#5fd592;--ok2:#12402a;--gr:#aab3c5;--gr2:#2a3552;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b1630;--card:#13244a;--tx:#eaf1ff;--mut:#9fb2d6;--bd:#27407a;--bl:#6aa5ff;--bl2:#1b3566;--yl:#ffc928;--yl2:#4a3a05;--ok:#5fd592;--ok2:#12402a;--gr:#aab3c5;--gr2:#2a3552;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px}
header{background:#0b4fa8;color:#fff;padding:14px 16px;border-bottom:4px solid var(--yl)}
header h1{margin:0;font-size:20px}header p{margin:2px 0 0;font-size:12px;opacity:.85}
main{max-width:900px;margin:0 auto;padding:12px}
nav{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px}
nav button{flex:1;white-space:nowrap;padding:10px 12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;font-weight:600;cursor:pointer}
nav button.on{background:var(--bl);color:#fff;border-color:var(--bl)}
:root:not([data-theme="light"]) nav button.on{color:#0b1630}
nav small{display:block;font-weight:400;opacity:.8}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
input,select,textarea{width:100%;padding:9px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx);font:inherit}
.bar input{flex:2;min-width:160px}.bar select{flex:1;min-width:130px}
.add{background:var(--yl);color:#1a1a1a;border:0;border-radius:8px;padding:9px 16px;font-weight:700;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:10px}
.item{background:var(--card);border:1px solid var(--bd);border-left:5px solid var(--bl);border-radius:10px;padding:12px}
.item h3{margin:0 0 6px;font-size:16px}
.row{display:flex;justify-content:space-between;gap:8px;padding:2px 0;font-size:14px}.row span:first-child{color:var(--mut)}.row span:last-child{text-align:right}
.badge{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700}
.b0{background:var(--bl2);color:var(--bl)}.b1{background:var(--yl2);color:#8a6500}.b2{background:var(--gr2);color:var(--gr)}.b3{background:var(--ok2);color:var(--ok)}
:root:not([data-theme="light"]) .b1{color:#ffc928}
.act{display:flex;gap:6px;margin-top:8px}.act button{flex:1;padding:7px;border:1px solid var(--bd);background:transparent;color:var(--tx);border-radius:8px;cursor:pointer}
.act .del{color:#d33}
.empty{text-align:center;color:var(--mut);padding:40px 10px}
.tools{display:flex;gap:8px;margin-top:16px;padding-top:12px;border-top:1px dashed var(--bd)}.tools button{flex:1;padding:10px;border:1px solid var(--bl);background:var(--bl2);color:var(--bl);border-radius:8px;font-weight:600;cursor:pointer}.tools+p{font-size:12px;color:var(--mut);margin:6px 0 0}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center;z-index:20}
.modal.on{display:flex}
.box{background:var(--bg);width:100%;max-width:520px;max-height:92%;overflow:auto;border-radius:14px 14px 0 0;padding:16px;border-top:4px solid var(--yl)}
.box label{display:block;font-size:13px;color:var(--mut);margin:10px 0 3px}
.box .f{display:flex;gap:8px;margin-top:14px}.box .f button{flex:1;padding:11px;border-radius:8px;border:0;font-weight:700;cursor:pointer}
.save{background:var(--bl);color:#fff}.cancel{background:var(--gr2);color:var(--tx)}
:root:not([data-theme="light"]) .save{color:#0b1630}
</style>
</head>
<body>
<header><h1>🏠 Bất động sản Thanh Hải</h1><p>Quản lý nhà, đất, căn hộ và khách hàng</p></header>
<main>
<nav id="nav"></nav>
<div class="bar"><input id="q" placeholder="Tìm kiếm..."><select id="flt"></select><button class="add" id="addBtn">+ Thêm</button></div>
<div class="grid" id="list"></div>
<div class="tools"><button id="exp">⬇ Xuất sao lưu</button><button id="imp">⬆ Nhập từ file</button><input type="file" id="file" accept=".json,application/json" hidden></div>
<p id="msg">Sao lưu định kỳ để không mất dữ liệu khi xóa dữ liệu trình duyệt hoặc đổi thiết bị.</p>
</main>
<div class="modal" id="modal"><div class="box"><h2 id="mt" style="margin:0"></h2><div id="form"></div><div class="f"><button class="cancel" id="cx">Hủy</button><button class="save" id="sv">Lưu</button></div></div></div>
<script>
var TT=["Chưa bán","Đang có khách quan tâm","Đã bán"],TC=["b0","b1","b3"],TH=["Thấp","Trung bình","Cao"];
var F={dt:["dt","Diện tích (m²)","text"],vt:["vt","Vị trí","text"],hu:["hu","Hướng","text"],st:["st","Số tầng","number"],pn:["pn","Số phòng ngủ","number"],pl:["pl","Pháp lý","text"],tt:["tt","Tình trạng","sel",TT],sd:["sd","Số điện thoại","tel"],gc:["gc","Ghi chú","area"]};
function mk(sd,keys){return keys.map(function(k){var f=F[k].slice();if(k==="sd")f[1]=sd;return f})}
var T={
nha:{n:"Nhà",ic:"🏠",f:mk("Số điện thoại chủ nhà",["dt","vt","hu","st","pn","pl","tt","sd","gc"]),title:"vt"},
dat:{n:"Đất",ic:"🌱",f:mk("Số điện thoại chủ đất",["dt","vt","hu","pl","tt","sd","gc"]),title:"vt"},
canho:{n:"Căn Hộ",ic:"🏢",f:mk("Số điện thoại chủ căn hộ",["dt","vt","pn","pl","tt","sd","gc"]),title:"vt"},
kh:{n:"Khách Hàng",ic:"👥",f:[["ten","Tên","text"],["sd","Số điện thoại","tel"],["dc","Địa chỉ","text"],["mh","Mức độ thân thiết","sel",TH],["gc","Ghi chú","area"]],title:"ten"}};
var S={nha:[],dat:[],canho:[],kh:[]},cur="nha",editId=null;
try{var raw=localStorage.getItem("bdsth");if(raw)S=Object.assign(S,JSON.parse(raw))}catch(e){}
function save(){try{localStorage.setItem("bdsth",JSON.stringify(S))}catch(e){}}
function $(i){return document.getElementById(i)}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function nav(){$("nav").innerHTML=Object.keys(T).map(function(k){return '<button data-k="'+k+'" class="'+(k===cur?"on":"")+'">'+T[k].ic+" "+T[k].n+"<small>"+S[k].length+"</small></button>"}).join("");
 Array.prototype.forEach.call($("nav").children,function(b){b.onclick=function(){cur=b.dataset.k;$("q").value="";flt();render()}})}
function flt(){var t=T[cur],isK=cur==="kh",o=isK?TH:TT;$("flt").innerHTML='<option value="">'+(isK?"Mọi mức thân thiết":"Mọi tình trạng")+"</option>"+o.map(function(x){return"<option>"+x+"</option>"}).join("")}
function render(){nav();var t=T[cur],q=$("q").value.toLowerCase(),fv=$("flt").value,fk=cur==="kh"?"mh":"tt";
 var a=S[cur].filter(function(r){return(!fv||r[fk]===fv)&&(!q||JSON.stringify(r).toLowerCase().indexOf(q)>-1)});
 if(!a.length){$("list").innerHTML='<div class="empty" style="grid-column:1/-1">Chưa có dữ liệu. Bấm “+ Thêm” để bắt đầu.</div>';return}
 $("list").innerHTML=a.map(function(r){var h='<div class="item"><h3>'+esc(r[t.title]||"(chưa có tên)")+"</h3>";
  t.f.forEach(function(f){if(f[0]===t.title||!r[f[0]])return;var v=esc(r[f[0]]);
   if(f[0]==="tt")v='<span class="badge '+TC[TT.indexOf(r.tt)]+'">'+v+"</span>";
   else if(f[0]==="mh")v='<span class="badge '+["b2","b1","b3"][TH.indexOf(r.mh)]+'">'+v+"</span>";
   else if(f[0]==="sd")v='<a href="tel:'+v+'" style="color:var(--bl)">'+v+"</a>";
   else if(f[0]==="dt")v+=" m²";
   h+='<div class="row"><span>'+f[1]+"</span><span>"+v+"</span></div>"});
  return h+'<div class="act"><button data-e="'+r.id+'">Sửa</button><button class="del" data-d="'+r.id+'">Xóa</button></div></div>'}).join("");
 Array.prototype.forEach.call($("list").querySelectorAll("[data-e]"),function(b){b.onclick=function(){open_(b.dataset.e)}});
 Array.prototype.forEach.call($("list").querySelectorAll("[data-d]"),function(b){b.onclick=function(){if(confirm("Xóa mục này?")){S[cur]=S[cur].filter(function(r){return r.id!==b.dataset.d});save();render()}}})}
function open_(id){editId=id||null;var t=T[cur],r=id?S[cur].filter(function(x){return x.id===id})[0]:{};
 $("mt").textContent=(id?"Sửa ":"Thêm ")+t.n;
 $("form").innerHTML=t.f.map(function(f){var v=esc(r[f[0]]||""),c;
  if(f[2]==="sel")c='<select data-f="'+f[0]+'">'+f[3].map(function(o){return"<option"+(o===(r[f[0]]||f[3][0])?" selected":"")+">"+o+"</option>"}).join("")+"</select>";
  else if(f[2]==="area")c='<textarea rows="3" data-f="'+f[0]+'">'+v+"</textarea>";
  else c='<input data-f="'+f[0]+'" type="'+f[2]+'" '+(f[2]==="tel"?'inputmode="tel" ':"")+'value="'+v+'">';
  return"<label>"+f[1]+"</label>"+c}).join("");
 $("modal").classList.add("on")}
$("sv").onclick=function(){var o={};Array.prototype.forEach.call($("form").querySelectorAll("[data-f]"),function(e){o[e.dataset.f]=e.value.trim()});
 if(editId){S[cur]=S[cur].map(function(r){return r.id===editId?Object.assign({id:editId},o):r})}
 else{o.id=Date.now().toString(36)+Math.random().toString(36).slice(2,5);S[cur].unshift(o)}
 save();$("modal").classList.remove("on");render()};
$("cx").onclick=function(){$("modal").classList.remove("on")};
$("addBtn").onclick=function(){open_()};
$("q").oninput=render;$("flt").onchange=render;
function say(t){$("msg").textContent=t}
$("exp").onclick=function(){claude.use("downloads").then(function(d){
 if(!d){say("Chưa xuất được file trong trình duyệt này.");return}
 var n=new Date(),p=function(x){return("0"+x).slice(-2)},ds=n.getFullYear()+"-"+p(n.getMonth()+1)+"-"+p(n.getDate());
 return d.save({filename:"bds-thanh-hai-sao-luu-"+ds+".json",data:JSON.stringify({app:"bds-thanh-hai",version:1,exported:n.toISOString(),data:S},null,2)}).then(function(){say("Đã xuất file sao lưu ngày "+ds+".")})
}).catch(function(e){if(!e||e.code!=="declined")say("Không xuất được file, hãy thử lại.")})};
$("imp").onclick=function(){$("file").click()};
$("file").onchange=function(){var f=this.files[0],inp=this;if(!f)return;var r=new FileReader();
 r.onload=function(){try{var j=JSON.parse(r.result),d=j&&j.app==="bds-thanh-hai"?j.data:null;if(!d)throw 0;var add=0,upd=0;
  if(!confirm("Nhập dữ liệu từ file sao lưu? Dữ liệu sẽ được gộp vào danh sách hiện tại (mục trùng sẽ được cập nhật).")){inp.value="";return}
  Object.keys(T).forEach(function(k){if(!Array.isArray(d[k]))return;d[k].forEach(function(it){if(!it||typeof it!=="object"||!it.id)return;
   var i=S[k].findIndex(function(x){return x.id===it.id});if(i>-1){S[k][i]=it;upd++}else{S[k].push(it);add++}})});
  save();render();say("Đã nhập: thêm "+add+" mục, cập nhật "+upd+" mục.")}catch(e){say("File không đúng định dạng sao lưu của ứng dụng.")}inp.value=""};
 r.readAsText(f)};
flt();render();
</script>
</body>
</html>
